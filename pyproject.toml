[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pypresso"
version = "0.0.1"
description = "Plane-wave DFT in Python and JAX, validated against Quantum ESPRESSO"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "jax>=0.4.30",
    "equinox>=0.11",
    "numpy>=1.26",
    "scipy>=1.11",
    "numba>=0.59",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
notebooks = ["jupyter>=1", "nbconvert>=7", "matplotlib>=3.8"]

[project.scripts]
pypresso = "pypresso.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pypresso"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, self-contained checks (no QE reference run needed)",
    "regression: compares a full pypresso run against a QE reference output",
    # `slow` is the line between the two groups, and the line is what gets run
    # when. `pytest -m "not slow"` is the gate -- 1634 tests in 4.5 minutes, and
    # it is what runs before a push. `pytest -m slow` is the other 588, over two
    # hours of them, and is run when asked for. See `tools/test-fast.sh` and
    # `tools/run_regression.sh`.
    "slow: outside the pre-push gate -- run on request, not before every push",
    "float32: also exercised under the single-precision policy",
]

[tool.ruff]
line-length = 100
